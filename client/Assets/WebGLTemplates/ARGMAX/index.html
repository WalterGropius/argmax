<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
  <title>ARGMAX · play</title>
  <meta name="description" content="A swarm-programming RTS for the dead internet. Learn to program a swarm in 28 tests.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #0e0d0b; overflow: hidden; color: #ece4d3; font-family: Jost, Futura, system-ui, sans-serif; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #0e0d0b; outline: none; }
    #loader { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #0e0d0b; }
    #mark { display: flex; align-items: center; gap: 22px; }
    #mark svg { height: 54px; width: auto; }
    #logo { font-family: Michroma, Futura, sans-serif; font-size: 46px; letter-spacing: 18px; color: #ece4d3; }
    #tag { font-size: 16px; opacity: .7; }
    #bar { width: 360px; max-width: 70vw; height: 4px; background: rgba(236, 228, 211, .12); }
    #fill { height: 100%; width: 0; background: #f4c20d; transition: width .2s; }
    #tip { font-size: 14px; opacity: .55; }
    #warn { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; font-size: 13px; color: #ff4626; }
    #links { position: absolute; top: 14px; right: 18px; font-family: Michroma, sans-serif; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; }
    #links a { color: #ece4d3; opacity: .6; text-decoration: none; margin-left: 16px; }
    #links a:hover { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader">
    <div id="mark"><svg viewBox="0 0 120 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#2f61ff"/><rect x="44" y="4" width="32" height="32" fill="#ff4626"/><polygon points="100,3 119,37 81,37" fill="#f4c20d"/></svg><div id="logo">ARGMAX</div></div>
    <div id="tag">you don't command the swarm. you write the function it maximizes.</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="tip">booting the Deadnet...</div>
  </div>
  <div id="links"><a href="../">whitepaper</a><a href="https://github.com/WalterGropius/argmax/releases/latest">download</a><a href="https://github.com/WalterGropius/argmax">source</a></div>
  <div id="warn"></div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var config = {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      showBanner: function (msg, type) { if (type === "error") document.querySelector("#warn").textContent = msg; },
    };
    var tips = ["2 + 2 = 4. so do 2 + 2 + 2 + 2 = 8, eventually.", "no unit ever searches a path. they lean on gradients.", "PROCTOR is warming up its sarcasm.", "every word of Argot is earned."];
    document.querySelector("#tip").textContent = tips[Math.floor(Math.random() * tips.length)];
    var script = document.createElement("script");
    script.src = "Build/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) { document.querySelector("#fill").style.width = (100 * p) + "%"; })
        .then(function () { document.querySelector("#loader").style.display = "none"; document.querySelector("#links").style.display = "none"; canvas.focus(); })
        .catch(function (e) { document.querySelector("#tip").textContent = "could not start: " + e; });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
