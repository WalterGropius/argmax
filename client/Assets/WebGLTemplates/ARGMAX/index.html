<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
  <title>ARGMAX · play</title>
  <meta name="description" content="A swarm-programming RTS for the dead internet. Learn to program a swarm in 28 tests.">
  <style>
    html, body { margin: 0; height: 100%; background: #03060c; overflow: hidden; color: #c8ecf5; font-family: Menlo, Consolas, "Roboto Mono", monospace; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #03060c; outline: none; }
    #loader { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: radial-gradient(circle at 50% 45%, #071624 0%, #03060c 70%); }
    #logo { font-size: 52px; letter-spacing: 20px; padding-left: 20px; color: #00e5ff; font-weight: bold; text-shadow: 0 0 24px rgba(0, 229, 255, .55); }
    #tag { font-size: 13px; opacity: .65; }
    #bar { width: 340px; max-width: 70vw; height: 3px; background: rgba(255, 255, 255, .08); }
    #fill { height: 100%; width: 0; background: #00e5ff; box-shadow: 0 0 12px #00e5ff; transition: width .2s; }
    #tip { font-size: 12px; opacity: .55; }
    #warn { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 12px; color: #ffb000; }
    #links { position: absolute; top: 10px; right: 14px; font-size: 12px; opacity: .55; }
    #links a { color: #00e5ff; text-decoration: none; margin-left: 12px; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader">
    <div id="logo">ARGMAX</div>
    <div id="tag">you don't command the swarm. you write the function it maximizes.</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="tip">booting the Deadnet...</div>
  </div>
  <div id="links"><a href="../">whitepaper</a><a href="https://github.com/WalterGropius/argmax/releases/latest">download</a><a href="https://github.com/WalterGropius/argmax">source</a></div>
  <div id="warn"></div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var config = {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      showBanner: function (msg, type) { if (type === "error") document.querySelector("#warn").textContent = msg; },
    };
    var tips = ["2 + 2 = 4. so do 2 + 2 + 2 + 2 = 8, eventually.", "no unit ever searches a path. they lean on gradients.", "PROCTOR is warming up its sarcasm.", "every word of Argot is earned."];
    document.querySelector("#tip").textContent = tips[Math.floor(Math.random() * tips.length)];
    var script = document.createElement("script");
    script.src = "Build/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) { document.querySelector("#fill").style.width = (100 * p) + "%"; })
        .then(function () { document.querySelector("#loader").style.display = "none"; document.querySelector("#links").style.display = "none"; canvas.focus(); })
        .catch(function (e) { document.querySelector("#tip").textContent = "could not start: " + e; });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
